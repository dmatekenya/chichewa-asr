# MMS adapter fine-tuning baseline hyperparameters
# Adapter-only training: base model frozen, only language adapters updated
model:
  model_name_or_path: facebook/mms-1b-all
  target_lang: nya                      # Chichewa ISO 639-3 code

training:
  per_device_train_batch_size: 32
  learning_rate: 1.0e-3                 # adapter LR — much higher than full fine-tuning
  warmup_steps: 500
  max_steps: 5000                       # early stopping will likely cut this short for 14h
  gradient_checkpointing: true
  bf16: true
  train_sampling_strategy: group_by_length
  length_column_name: input_length
  save_steps: 500
  logging_steps: 25
  save_total_limit: 3

evaluation:
  eval_strategy: steps
  eval_steps: 500
  load_best_model_at_end: true
  metric_for_best_model: wer
  greater_is_better: false

hub:
  push_to_hub: true
  hub_strategy: every_save
  report_to:
    - tensorboard
