model:
  model_name_or_path: facebook/mms-1b-all
  target_lang: nya   # Chichewa/Nyanja ISO-639-3
  training_mode: adapter

training:
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-3
  warmup_steps: 100
  num_train_epochs: 4
  group_by_length: true
  gradient_checkpointing: true
  bf16: true
  fp16: false
  save_steps: 200
  eval_steps: 100
  logging_steps: 25
  save_total_limit: 3